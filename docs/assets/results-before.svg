<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 442" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Before reranking: searching "birthday at the beach" returns the same fixed order for everyone; the birthday photos sit at ranks 3 and 4.</title>
  <rect x="0" y="0" width="460" height="442" fill="#ffffff"/>

  <!-- search bar -->
  <rect x="20" y="18" width="420" height="40" rx="20" fill="#f3f4f6" stroke="#d1d5db"/>
