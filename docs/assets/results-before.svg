  <!-- row 3: cake on the sand -->
  <rect x="20" y="260" width="420" height="70" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="38" y="300" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">3</text>
  <rect x="56" y="268" width="76" height="54" rx="6" fill="#fde68a"/>
  <rect x="82" y="296" width="24" height="16" rx="2" fill="#fbcfe8"/>
  <rect x="87" y="288" width="14" height="8" fill="#f9a8d4"/>
  <line x1="91" y1="284" x2="91" y2="288" stroke="#b45309" stroke-width="1.5"/>
