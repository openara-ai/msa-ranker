  <line x1="49" y1="41" x2="55" y2="47" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <text x="66" y="43" font-size="14" fill="#111827">birthday at the beach</text>

  <text x="20" y="84" font-size="11.5" font-weight="600" letter-spacing="0.08em" fill="#6b7280">BEFORE · THE SAME FIXED ORDER FOR EVERYONE</text>

