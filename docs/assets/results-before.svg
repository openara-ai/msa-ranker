  <circle cx="68" cy="308" r="5" fill="#6b7280"/>
  <circle cx="114" cy="308" r="5" fill="#6b7280"/>
  <circle cx="122" cy="298" r="4" fill="#6b7280"/>
  <text x="148" y="290" font-size="14" fill="#111827">cake on the sand, everyone singing</text>
  <text x="148" y="310" font-size="12" fill="#6b7280">2016</text>

  <!-- row 4: picnic table -->
