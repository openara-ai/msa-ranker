  <rect x="56" y="186" width="76" height="54" rx="6" fill="#fef3c7"/>
  <path d="M64,206 Q78,190 92,206 Z" fill="#f87171"/>
  <line x1="78" y1="204" x2="78" y2="226" stroke="#9ca3af" stroke-width="2"/>
  <rect x="98" y="220" width="26" height="6" rx="3" fill="#60a5fa"/>
